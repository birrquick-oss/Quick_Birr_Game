<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta name="theme-color" content="#0d1119">

    <title>QUICK_BIRR GAMES</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="top-bar">

        <div class="brand">

            <div class="brand-logo">
                ⚡
            </div>

            <div>
                <div class="brand-name">
                    QUICK_BIRR
                </div>

                <div class="brand-subtitle">
                    GAMES
                </div>
            </div>

        </div>


        <button
            class="balance-box"
            id="balanceButton"
            type="button"
        >

            <span class="balance-icon">
                💰
            </span>

            <span id="balance">
                0.00 ETB
            </span>

            <span class="refresh-icon">
                ↻
            </span>

        </button>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">

                <span class="hero-badge">
                    🎮 PLAY & WIN
                </span>

                <h1>
                    Welcome to<br>
                    <strong>QUICK_BIRR GAMES</strong>
                </h1>

                <p>
                    Your favorite games,
                    all in one place.
                </p>

                <button
                    class="primary-button"
                    id="playNowButton"
                    type="button"
                >
                    🎮 PLAY NOW
                </button>

            </div>

            <div class="hero-decoration">
                🎰
            </div>

        </section>


        <!-- =========================
             QUICK ACTIONS
        ========================== -->

        <section class="quick-actions">

            <button
                class="action-button withdraw"
                type="button"
                id="withdrawButton"
            >
                <span>💸</span>
                Withdraw
            </button>

            <button
                class="action-button deposit"
                type="button"
                id="depositButton"
            >
                <span>💰</span>
                Deposit
            </button>

        </section>


        <!-- =========================
             FEATURED GAMES
        ========================== -->

        <section class="games-section">

            <div class="section-header">

                <div>
                    <h2>
                        🎮 Featured Games
                    </h2>

                    <p>
                        Choose your favorite game
                    </p>
                </div>

                <button
                    class="see-all"
                    id="seeAllButton"
                    type="button"
                >
                    See all →
                </button>

            </div>


            <div class="games-grid">


                <!-- BINGO -->

                <button
                    class="game-card bingo-card"
                    data-game="bingo"
                    type="button"
                >

                    <div class="game-image">
                        <span class="game-icon">
                            🎱
                        </span>

                        <span class="game-star">
                            ★
                        </span>
                    </div>

                    <div class="game-info">

                        <h3>
                            QUICK BIRR BINGO
                        </h3>

                        <p>
                            1–1000 Numbers
                        </p>

                        <span class="game-price">
                            10 ETB
                        </span>

                    </div>

                </button>


                <!-- SLOTS -->

                <button
                    class="game-card slots-card"
                    data-game="slots"
                    type="button"
                >

                    <div class="game-image">
                        <span class="game-icon">
                            🎰
                        </span>

                        <span class="game-star">
                            ★
                        </span>
                    </div>

                    <div class="game-info">

                        <h3>
                            Lucky Slots
                        </h3>

                        <p>
                            Spin & Win
                        </p>

                        <span class="game-price">
                            Coming Soon
                        </span>

                    </div>

                </button>


                <!-- PLINKO -->

                <button
                    class="game-card plinko-card"
                    data-game="plinko"
                    type="button"
                >

                    <div class="game-image">
                        <span class="game-icon">
                            🟢
                        </span>

                        <span class="game-star">
                            ★
                        </span>
                    </div>

                    <div class="game-info">

                        <h3>
                            Plinko
                        </h3>

                        <p>
                            Drop & Win
                        </p>

                        <span class="game-price">
                            Coming Soon
                        </span>

                    </div>

                </button>


                <!-- ROULETTE -->

                <button
                    class="game-card roulette-card"
                    data-game="roulette"
                    type="button"
                >

                    <div class="game-image">
                        <span class="game-icon">
                            🎡
                        </span>

                        <span class="game-star">
                            ★
                        </span>
                    </div>

                    <div class="game-info">

                        <h3>
                            Roulette
                        </h3>

                        <p>
                            European Roulette
                        </p>

                        <span class="game-price">
                            Coming Soon
                        </span>

                    </div>

                </button>


                <!-- BLACKJACK -->

                <button
                    class="game-card blackjack-card"
                    data-game="blackjack"
                    type="button"
                >

                    <div class="game-image">
                        <span class="game-icon">
                            🃏
                        </span>

                        <span class="game-star">
                            ★
                        </span>
                    </div>

                    <div class="game-info">

                        <h3>
                            Blackjack
                        </h3>

                        <p>
                            21
                        </p>

                        <span class="game-price">
                            Coming Soon
                        </span>

                    </div>

                </button>


                <!-- MINES -->

                <button
                    class="game-card mines-card"
                    data-game="mines"
                    type="button"
                >

                    <div class="game-image">
                        <span class="game-icon">
                            💎
                        </span>

                        <span class="game-star">
                            ★
                        </span>
                    </div>

                    <div class="game-info">

                        <h3>
                            Mines
                        </h3>

                        <p>
                            Find the Gems
                        </p>

                        <span class="game-price">
                            Coming Soon
                        </span>

                    </div>

                </button>

            </div>

        </section>


        <!-- =========================
             PROMO
        ========================== -->

        <section class="promo-card">

            <div class="promo-icon">
                🎁
            </div>

            <div class="promo-content">

                <h2>
                    More Games Coming Soon
                </h2>

                <p>
                    New games and exciting
                    features are on the way.
                </p>

            </div>

            <span class="promo-arrow">
                →
            </span>

        </section>


        <!-- =========================
             STATS
        ========================== -->

        <section class="stats-section">

            <div class="stat-box">
                <strong id="playerCount">
                    0
                </strong>
                <span>
                    Players
                </span>
            </div>

            <div class="stat-box">
                <strong>
                    6+
                </strong>
                <span>
                    Games
                </span>
            </div>

            <div class="stat-box">
                <strong>
                    24/7
                </strong>
                <span>
                    Available
                </span>
            </div>

        </section>

    </main>


    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="bottom-nav">

        <button
            class="nav-item active"
            data-page="home"
            type="button"
        >
            <span>⌂</span>
            <small>Home</small>
        </button>

        <button
            class="nav-item"
            data-page="games"
            type="button"
        >
            <span>🎮</span>
            <small>Games</small>
        </button>

        <button
            class="nav-item"
            data-page="promo"
            type="button"
        >
            <span>🎁</span>
            <small>Promo</small>
        </button>

        <button
            class="nav-item"
            data-page="profile"
            type="button"
        >
            <span>👤</span>
            <small>Profile</small>
        </button>

    </nav>

</div>


<!-- =========================
     MODAL
========================== -->

<div
    class="modal"
    id="messageModal"
    hidden
>

    <div class="modal-overlay"></div>

    <div class="modal-box">

        <button
            class="modal-close"
            id="modalClose"
            type="button"
        >
            ×
        </button>

        <div
            class="modal-icon"
            id="modalIcon"
        >
            🎮
        </div>

        <h2 id="modalTitle">
            QUICK_BIRR GAMES
        </h2>

        <p id="modalMessage">
            Coming soon.
        </p>

        <button
            class="primary-button modal-button"
            id="modalButton"
            type="button"
        >
            OK
        </button>

    </div>

</div>


<!-- Main JavaScript -->
<script src="app.js"></script>

</body>
</html>
